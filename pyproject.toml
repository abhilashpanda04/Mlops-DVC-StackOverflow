[project]
name = "mlops-dvc-stackoverflow"
version = "0.1.0"
description = "A DVC NLP pipeline for Stack Overflow text classification."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "dvc[gdrive]>=3.67.1",
    "gdown>=5.2.1",
    "numpy>=2.4.4",
    "pandas>=3.0.2",
    "pyyaml>=6.0.3",
    "scikit-learn>=1.8.0",
    "scipy>=1.17.1",
    "tqdm>=4.67.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
